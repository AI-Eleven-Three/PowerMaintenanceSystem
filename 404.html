<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/PowerMaintenanceSystem/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电力设备运维管理系统</title>
    <script>
      // 重定向所有404请求到index.html
      if (window.location.pathname.includes('/PowerMaintenanceSystem/') && 
          !window.location.pathname.endsWith('/PowerMaintenanceSystem/') &&
          !window.location.pathname.includes('/assets/') &&
          !window.location.pathname.includes('/vite.svg')) {
        const baseUrl = window.location.origin + '/PowerMaintenanceSystem/';
        const path = window.location.pathname.replace('/PowerMaintenanceSystem/', '');
        window.location.href = baseUrl + '?p=' + path + window.location.search;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/PowerMaintenanceSystem/src/main.jsx"></script>
  </body>
</html>
